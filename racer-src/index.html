<!DOCTYPE html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#9fa7b0" />
    <title>Lumber & Lairy — Finley Watson</title>
    <link rel="stylesheet" href="./src/styles/main.css" />
  </head>
  <body>
    <div id="game">
      <!-- Three.js canvas is injected here by Game.ts -->

      <!-- ===== HUD overlay ===== -->
      <div id="hud" class="hidden">
        <div class="hud-corner hud-top-left">
          <canvas id="minimap" width="150" height="150"></canvas>
          <div class="hud-row"><span class="hud-label">LAP</span><span id="lap">1/3</span></div>
          <div class="hud-row"><span class="hud-label">TIME</span><span id="time">0:00.0</span></div>
          <div class="hud-row"><span class="hud-label">BEST</span><span id="best">--:--.-</span></div>
        </div>
        <div class="hud-corner hud-top-right">
          <div id="speedo">
            <div id="speedo-gauge"></div>
            <div id="speed">0</div>
            <div class="speed-unit">MPH-ISH</div>
          </div>
        </div>
        <div id="boost-wrap">
          <span class="hud-label">LEGGIT</span>
          <div id="boost-bar"><div id="boost-fill"></div></div>
        </div>
      </div>

      <!-- ===== Big centre message (countdown / results) ===== -->
      <div id="message" class="hidden"></div>

      <!-- ===== Restart ===== -->
      <button id="restart" class="hidden" type="button">↻ RESTART (R)</button>

      <!-- ===== On-screen touch controls (shown on touch devices) ===== -->
      <div id="touch-controls" class="hidden">
        <div class="pad pad-left">
          <button id="btn-left" class="tbtn" type="button" aria-label="Steer left">◀</button>
          <button id="btn-right" class="tbtn" type="button" aria-label="Steer right">▶</button>
        </div>
        <div class="pad pad-right">
          <button id="btn-drift" class="tbtn tbtn-wide" type="button" aria-label="Drift">DRIFT</button>
          <button id="btn-boost" class="tbtn tbtn-wide tbtn-boost" type="button" aria-label="Boost">LEGGIT</button>
          <button id="btn-jump" class="tbtn tbtn-jump" type="button" aria-label="Jump">JUMP</button>
          <button id="btn-brake" class="tbtn" type="button" aria-label="Brake / reverse">▼</button>
          <button id="btn-accel" class="tbtn tbtn-accel" type="button" aria-label="Accelerate">▲</button>
        </div>
      </div>
    </div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
