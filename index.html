<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a0a0f'/%3E%3Cg fill='%2339ff14'%3E%3Crect x='4' y='8' width='24' height='9' rx='4'/%3E%3Crect x='3.5' y='11' width='8.5' height='14' rx='4.2'/%3E%3Crect x='20' y='11' width='8.5' height='14' rx='4.2'/%3E%3C/g%3E%3Cg fill='%230a0a0f'%3E%3Crect x='4.6' y='13.9' width='7.4' height='2.5' rx='0.5'/%3E%3Crect x='7.05' y='11.45' width='2.5' height='7.4' rx='0.5'/%3E%3Ccircle cx='22.3' cy='13.6' r='1.9'/%3E%3Ccircle cx='25.6' cy='16.4' r='1.9'/%3E%3C/g%3E%3C/svg%3E">
    <title>Finley Watson</title>
    <meta name="theme-color" content="#050110">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --void: #050110;
            --void-2: #0b0524;
            --core: #ffe9c7;
            --star: #f4f1ff;
            --nebula-magenta: #ff4d9d;
            --nebula-violet: #7b46ff;
            --nebula-cyan: #35d0ff;
            --orb: clamp(56px, 11.5vmin, 88px);
        }

        html, body {
            height: 100%;
        }

        body {
            background: var(--void);
            color: var(--star);
            font-family: "Space Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow: hidden;
            overscroll-behavior: none;
        }

        /* Full-viewport galaxy stage */
        .galaxy {
            position: fixed;
            inset: 0;
            overflow: hidden;
            background:
                radial-gradient(120% 90% at 50% 46%, #150a33 0%, var(--void-2) 38%, var(--void) 72%, #020008 100%);
        }

        #stars {
            position: absolute;
            inset: 0;
            z-index: 1;
        }

        /* Soft drifting nebula clouds — CSS-blurred colour fields */
        .nebula {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            mix-blend-mode: screen;
            opacity: 0.5;
            z-index: 1;
            pointer-events: none;
            will-change: transform;
        }
        .nebula.n1 {
            width: 46vmax; height: 46vmax;
            left: 8%; top: 18%;
            background: radial-gradient(circle, var(--nebula-violet) 0%, transparent 62%);
            animation: drift1 46s ease-in-out infinite alternate;
        }
        .nebula.n2 {
            width: 40vmax; height: 40vmax;
            right: 6%; bottom: 10%;
            background: radial-gradient(circle, var(--nebula-magenta) 0%, transparent 60%);
            animation: drift2 58s ease-in-out infinite alternate;
        }
        .nebula.n3 {
            width: 34vmax; height: 34vmax;
            left: 40%; top: 4%;
            background: radial-gradient(circle, var(--nebula-cyan) 0%, transparent 58%);
            opacity: 0.35;
            animation: drift3 52s ease-in-out infinite alternate;
        }

        @keyframes drift1 { from { transform: translate(0,0) scale(1); } to { transform: translate(6vmax,4vmax) scale(1.12); } }
        @keyframes drift2 { from { transform: translate(0,0) scale(1.05); } to { transform: translate(-5vmax,-3vmax) scale(1); } }
        @keyframes drift3 { from { transform: translate(0,0) scale(1); } to { transform: translate(-4vmax,5vmax) scale(1.1); } }

        /* Galactic core — the wordmark */
        .core-label {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            z-index: 3;
            text-align: center;
            pointer-events: none;
            padding: 0 1rem;
            width: min(92vw, 640px);
        }

        .wordmark {
            --edge: rgba(5, 1, 16, 0.92);   /* crisp per-letter contour */
            font-weight: 700;
            font-size: clamp(2.1rem, 9vw, 5.25rem);
            line-height: 0.95;
            letter-spacing: 0.02em;
            color: #fffaf0;
            text-shadow:
                /* tight dark outline (8 directions) so each letter cuts
                   cleanly out of the bright galactic core behind it */
                -1px -1px 0 var(--edge),  1px -1px 0 var(--edge),
                -1px  1px 0 var(--edge),  1px  1px 0 var(--edge),
                 0   -1px 0 var(--edge),  0    1px 0 var(--edge),
                -1px  0   0 var(--edge),  1px  0   0 var(--edge),
                /* soft dark separation halo */
                 0    0   4px rgba(5, 1, 16, 0.85),
                /* the letter's own warm glow */
                 0    0   9px rgba(255, 236, 206, 0.95),
                 0    0   20px rgba(255, 208, 146, 0.75),
                 0    0   42px rgba(255, 178, 108, 0.5);
        }
        .wordmark .a { display: block; }

        .subtitle {
            margin-top: 1rem;
            font-size: clamp(0.8rem, 2.2vw, 1.05rem);
            font-weight: 500;
            letter-spacing: 0.42em;
            text-transform: uppercase;
            color: rgba(233, 224, 255, 0.62);
            padding-left: 0.42em; /* balance the tracking */
        }

        /* Planets */
        .planet {
            position: absolute;
            left: 0;
            top: 0;
            width: var(--orb);
            height: var(--orb);
            z-index: 2;
            text-decoration: none;
            outline: none;
            will-change: transform, opacity;
            -webkit-tap-highlight-color: transparent;
        }

        .orb {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: radial-gradient(circle at 32% 27%,
                var(--light) 0%, var(--mid) 46%, var(--dark) 100%);
            box-shadow:
                0 0 26px 5px color-mix(in srgb, var(--glow) 55%, transparent),
                inset -7px -9px 18px rgba(0, 0, 0, 0.55),
                inset 7px 8px 15px rgba(255, 255, 255, 0.20);
            transition: box-shadow 0.25s ease;
        }

        /* Saturn-style ring */
        .orb.ring::after {
            content: "";
            position: absolute;
            left: 50%;
            top: 50%;
            width: 178%;
            height: 58%;
            transform: translate(-50%, -50%) rotate(-24deg);
            border-radius: 50%;
            border: 4px solid color-mix(in srgb, var(--glow) 70%, transparent);
            border-bottom-color: transparent;
            box-shadow: 0 0 10px color-mix(in srgb, var(--glow) 45%, transparent);
        }

        /* Little orbiting moon */
        .moon-orbit {
            position: absolute;
            inset: -18%;
            border-radius: 50%;
            animation: moonspin 9s linear infinite;
            pointer-events: none;
        }
        .moon-orbit::after {
            content: "";
            position: absolute;
            left: 50%;
            top: -3px;
            width: 22%;
            height: 22%;
            transform: translateX(-50%);
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #fff, #b9a7d8 60%, #5b4a86);
            box-shadow: 0 0 8px rgba(220, 200, 255, 0.7);
        }
        @keyframes moonspin { to { transform: rotate(360deg); } }

        .emoji {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: calc(var(--orb) * 0.46);
            filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.45));
            pointer-events: none;
        }

        .label {
            position: absolute;
            top: calc(100% + 0.55rem);
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            white-space: nowrap;
            pointer-events: none;
        }
        .name {
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.01em;
            color: #f3edff;
            text-shadow: 0 0 12px color-mix(in srgb, var(--glow) 80%, transparent), 0 1px 4px rgba(0,0,0,0.6);
        }
        .plays {
            display: block;
            margin-top: 0.12rem;
            font-size: 0.66rem;
            font-weight: 500;
            letter-spacing: 0.06em;
            color: rgba(214, 205, 240, 0.5);
        }

        /* Hover / focus emphasis (also applied while the planet is frozen) */
        .planet.active .orb {
            box-shadow:
                0 0 40px 10px color-mix(in srgb, var(--glow) 80%, transparent),
                inset -7px -9px 18px rgba(0, 0, 0, 0.5),
                inset 7px 8px 15px rgba(255, 255, 255, 0.28);
        }
        .planet:focus-visible {
            outline: none;
        }
        .planet:focus-visible .orb {
            box-shadow:
                0 0 0 3px rgba(255, 255, 255, 0.9),
                0 0 40px 10px color-mix(in srgb, var(--glow) 80%, transparent);
        }

        /* Reduced motion: kill drifts + spins (JS also freezes the swirl) */
        @media (prefers-reduced-motion: reduce) {
            .nebula, .moon-orbit { animation: none !important; }
        }
    </style>
</head>
<body>
    <main class="galaxy" id="galaxy" aria-label="Finley Watson — pick a game">
        <canvas id="stars"></canvas>
        <div class="nebula n1"></div>
        <div class="nebula n2"></div>
        <div class="nebula n3"></div>

        <div class="core-label">
            <h1 class="wordmark"><span class="a">Finley</span><span class="a">Watson</span></h1>
            <p class="subtitle">Pick a planet</p>
        </div>
        <!-- Planets are injected here by script -->
    </main>

    <script>
    (function () {
        "use strict";

        var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

        // --- Games (each a planet). Order sets their starting spread. ---
        var GAMES = [
            { id: "snake",  title: "Snake",          href: "snake.html",           emoji: "🐍",
              light: "#c9ffdd", mid: "#22c55e", dark: "#064e27", glow: "#3ef08a", r: 0.74, speed: 1.30 },
            { id: "bike",   title: "Bike Runner",    href: "bike.html",            emoji: "🚴",
              light: "#ffe6b0", mid: "#ff9f1c", dark: "#7a3d00", glow: "#ffb84d", r: 1.02, speed: 1.02 },
            { id: "racer",  title: "Lumber & Lairy", href: "racer/",               emoji: "🏎️",
              light: "#ffd2c6", mid: "#ff5a4d", dark: "#6e0f16", glow: "#ff7a5c", r: 1.24, speed: 0.86, ring: true },
            { id: "invaders", title: "Space Invaders", href: "space-invaders.html", emoji: "👾",
              light: "#e9d9ff", mid: "#a06bff", dark: "#2e1065", glow: "#c79bff", r: 0.90, speed: 1.15, moon: true },
            { id: "coaster", title: "Thrillsbury Park", href: "coaster.html",      emoji: "🎢",
              light: "#ffd0b8", mid: "#e8622e", dark: "#6b1f08", glow: "#ff8a52", r: 1.13, speed: 0.94, ring: true }
        ];

        var TILT = 0.5;          // star-disk vertical squash → seen on an angle
        var MAXR = 1.24;         // largest planet orbit multiplier (keep in sync w/ GAMES)
        var galaxy = document.getElementById("galaxy");

        // ---------- Play counters (per-device, no backend) ----------
        var CKEY = "finley-play-counts";
        function loadCounts() {
            try { return JSON.parse(localStorage.getItem(CKEY)) || {}; }
            catch (e) { return {}; }
        }
        function saveCounts(c) {
            try { localStorage.setItem(CKEY, JSON.stringify(c)); } catch (e) {}
        }
        function playLabel(n) { return n + (n === 1 ? " play" : " plays"); }
        var counts = loadCounts();

        // ---------- Build planet elements ----------
        GAMES.forEach(function (g, i) {
            var a = document.createElement("a");
            a.className = "planet";
            a.href = g.href;
            a.setAttribute("aria-label", g.title + ", " + playLabel(counts[g.id] || 0));
            a.style.setProperty("--light", g.light);
            a.style.setProperty("--mid", g.mid);
            a.style.setProperty("--dark", g.dark);
            a.style.setProperty("--glow", g.glow);

            var orb = document.createElement("span");
            orb.className = "orb" + (g.ring ? " ring" : "");
            a.appendChild(orb);

            if (g.moon) {
                var mo = document.createElement("span");
                mo.className = "moon-orbit";
                orb.appendChild(mo);
            }

            var em = document.createElement("span");
            em.className = "emoji";
            em.textContent = g.emoji;
            a.appendChild(em);

            var label = document.createElement("span");
            label.className = "label";
            label.innerHTML = '<span class="name"></span><span class="plays"></span>';
            label.querySelector(".name").textContent = g.title;
            label.querySelector(".plays").textContent = playLabel(counts[g.id] || 0);
            a.appendChild(label);

            g.el = a;
            g.angle = (i / GAMES.length) * Math.PI * 2 + 0.4;
            g.paused = false;
            g.hoverK = 0;   // eased hover emphasis 0..1

            // Freeze while hovered/focused so it's an easy click/tap target.
            function freeze() { g.paused = true; a.classList.add("active"); }
            function thaw() { g.paused = false; a.classList.remove("active"); }
            a.addEventListener("pointerenter", freeze);
            a.addEventListener("pointerleave", thaw);
            a.addEventListener("pointerdown", freeze);
            a.addEventListener("focus", freeze);
            a.addEventListener("blur", thaw);

            a.addEventListener("click", function () {
                counts[g.id] = (counts[g.id] || 0) + 1;
                saveCounts(counts);
            });

            galaxy.appendChild(a);
        });

        // ---------- Star field (canvas) ----------
        var canvas = document.getElementById("stars");
        var ctx = canvas.getContext("2d");
        var W = 0, H = 0, cx = 0, cy = 0, maxR = 0, dpr = 1;

        var spiral = [];   // rotating disk stars
        var field = [];    // static background stars
        var sprites = {};  // pre-rendered glow sprites by colour

        function makeSprite(rgb) {
            var s = 26, c = document.createElement("canvas");
            c.width = c.height = s;
            var g = c.getContext("2d");
            var grad = g.createRadialGradient(s/2, s/2, 0, s/2, s/2, s/2);
            grad.addColorStop(0, "rgba(" + rgb + ",1)");
            grad.addColorStop(0.35, "rgba(" + rgb + ",0.55)");
            grad.addColorStop(1, "rgba(" + rgb + ",0)");
            g.fillStyle = grad;
            g.fillRect(0, 0, s, s);
            return c;
        }
        sprites.white   = makeSprite("244,241,255");
        sprites.cyan    = makeSprite("120,215,255");
        sprites.magenta = makeSprite("255,150,205");

        function pickColour() {
            var t = Math.random();
            return t < 0.7 ? sprites.white : (t < 0.85 ? sprites.cyan : sprites.magenta);
        }

        function buildStars() {
            spiral = [];
            field = [];
            var area = W * H;
            var count = Math.min(1100, Math.round(area / 1500));
            var arms = 2, WIND = 3.6;
            for (var i = 0; i < count; i++) {
                var rFrac = Math.pow(Math.random(), 1.45);          // dense core
                var inArm = Math.random() < 0.72;
                var base;
                if (inArm) {
                    var arm = Math.floor(Math.random() * arms);
                    var spread = (Math.random() - 0.5) * (0.9 - 0.5 * rFrac);
                    base = arm * (Math.PI * 2 / arms) + rFrac * WIND + spread;
                } else {
                    base = Math.random() * Math.PI * 2;             // halo star
                }
                spiral.push({
                    r: rFrac,
                    a: base,
                    // inner stars rotate faster (differential rotation)
                    omega: (0.030 + 0.055 / (rFrac + 0.32)),
                    size: 0.7 + Math.random() * 1.9 + (rFrac < 0.12 ? 1.4 : 0),
                    bright: 0.35 + Math.random() * 0.65,
                    tw: Math.random() * Math.PI * 2,
                    tws: 0.6 + Math.random() * 1.6,
                    sprite: pickColour()
                });
            }
            var fcount = Math.min(260, Math.round(area / 8000));
            for (var j = 0; j < fcount; j++) {
                field.push({
                    x: Math.random(), y: Math.random(),
                    size: 0.6 + Math.random() * 1.3,
                    bright: 0.15 + Math.random() * 0.4,
                    tw: Math.random() * Math.PI * 2,
                    tws: 0.4 + Math.random() * 1.2,
                    sprite: sprites.white
                });
            }
        }

        function resize() {
            W = window.innerWidth;
            H = window.innerHeight;
            dpr = Math.min(window.devicePixelRatio || 1, 2);
            canvas.width = Math.round(W * dpr);
            canvas.height = Math.round(H * dpr);
            canvas.style.width = W + "px";
            canvas.style.height = H + "px";
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            cx = W / 2;
            cy = H / 2;
            maxR = Math.hypot(W, H) / 2 * 1.06;
            buildStars();
        }

        // Responsive orbit radii. Horizontal & vertical are computed
        // separately and capped so the widest planet + its label always
        // stay on screen: a tall ellipse in portrait, a wide tilted disk
        // on desktop.
        var LABELPAD = 84;   // px kept clear at left/right for labels
        var VPAD = 74;       // px kept clear top/bottom for the label + orb
        function orbitRadii() {
            var rx = Math.min(W * 0.32, (W / 2 - LABELPAD) / MAXR);
            var ry = Math.min(H * 0.30, (H / 2 - VPAD) / MAXR);
            return { rx: Math.max(60, rx), ry: Math.max(60, ry) };
        }

        var last = 0;

        function positionPlanets(dt) {
            var R = orbitRadii();
            for (var i = 0; i < GAMES.length; i++) {
                var g = GAMES[i];
                if (!reduce && !g.paused) g.angle += g.speed * 0.16 * dt;

                var x = cx + R.rx * g.r * Math.cos(g.angle);
                var y = cy + R.ry * g.r * Math.sin(g.angle);
                var depth = (Math.sin(g.angle) + 1) / 2;   // 0 back … 1 front

                // ease hover emphasis
                var target = g.paused ? 1 : 0;
                g.hoverK += (target - g.hoverK) * Math.min(1, dt * 10);

                var scale = (0.84 + 0.20 * depth) + 0.16 * g.hoverK;
                var opacity = (0.62 + 0.38 * depth) + (1 - (0.62 + 0.38 * depth)) * g.hoverK;

                g.el.style.transform =
                    "translate(" + x.toFixed(1) + "px," + y.toFixed(1) + "px) " +
                    "translate(-50%,-50%) scale(" + scale.toFixed(3) + ")";
                g.el.style.opacity = opacity.toFixed(3);
                g.el.style.zIndex = (depth < 0.5 ? 2 : 4) + (g.paused ? 3 : 0);
            }
        }

        function drawStars(t, dt) {
            ctx.clearRect(0, 0, W, H);
            ctx.globalCompositeOperation = "lighter";

            // background static field
            for (var j = 0; j < field.length; j++) {
                var f = field[j];
                var fa = f.bright * (0.6 + 0.4 * Math.sin(f.tw + t * f.tws));
                var fs = f.size * 3.4;
                ctx.globalAlpha = Math.max(0, fa);
                ctx.drawImage(f.sprite, f.x * W - fs / 2, f.y * H - fs / 2, fs, fs);
            }

            // rotating spiral disk
            for (var i = 0; i < spiral.length; i++) {
                var s = spiral[i];
                if (!reduce) s.a += s.omega * dt;
                var pr = s.r * maxR;
                var x = cx + pr * Math.cos(s.a);
                var y = cy + pr * TILT * Math.sin(s.a);
                var tw = 0.7 + 0.3 * Math.sin(s.tw + t * s.tws);
                var sz = s.size * 3.4;
                ctx.globalAlpha = Math.max(0, s.bright * tw);
                ctx.drawImage(s.sprite, x - sz / 2, y - sz / 2, sz, sz);
            }

            // warm galactic core bloom
            var pulse = 1 + 0.05 * Math.sin(t * 0.8);
            var coreR = Math.min(W, H) * 0.20 * pulse;
            var cg = ctx.createRadialGradient(cx, cy, 0, cx, cy, coreR);
            cg.addColorStop(0, "rgba(255,240,214,0.85)");
            cg.addColorStop(0.35, "rgba(255,205,140,0.35)");
            cg.addColorStop(1, "rgba(255,180,110,0)");
            ctx.globalAlpha = 1;
            ctx.fillStyle = cg;
            ctx.beginPath();
            ctx.arc(cx, cy, coreR, 0, Math.PI * 2);
            ctx.fill();

            ctx.globalAlpha = 1;
            ctx.globalCompositeOperation = "source-over";
        }

        function frame(now) {
            var t = now / 1000;
            var dt = last ? Math.min(0.05, (now - last) / 1000) : 0.016;
            last = now;
            drawStars(t, dt);
            positionPlanets(dt);
            requestAnimationFrame(frame);
        }

        window.addEventListener("resize", resize, { passive: true });
        resize();

        if (reduce) {
            // one static paint (planets spread evenly, no swirl)
            positionPlanets(0);
            drawStars(0, 0);
        } else {
            requestAnimationFrame(frame);
        }
    })();
    </script>
</body>
</html>
