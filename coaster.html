}

function placeScenery(x, y) {
  var t = tileAt(x, y);
  if (!t) return;
  if (ui.scenery === 'clear') {
    if (!t.obj || t.obj.type === 'entrance') { toast('NOTHING TO CLEAR'); sfxDeny(); return; }
    t.obj = null; sfxPlace();
    return;
  }
  var sc = SCENERY[ui.scenery];
  if (t.t !== 'grass') { toast('ONLY ON THE GRASS'); sfxDeny(); return; }
  if (t.obj) { toast('SOMETHING IS THERE ALREADY'); sfxDeny(); return; }
  if (park.cash < sc.cost) { toast('NOT ENOUGH MONEY'); sfxDeny(); return; }
  park.cash -= sc.cost;
  t.obj = { type: ui.scenery, v: (Math.random() * SPR.tree.length) | 0 };
  sfxPlace();
}

function pressButton(b) {
  sfxClick();
  if (b.scenery) {
    ui.mode = 'scenery';
    ui.scenery = b.scenery;
    layoutUI();
    return;
  }
  if (b.piece) ui.mode = 'track';
  if (b.piece) {
    // tapping the piece you already have selected builds it, so a run of
    // straights is one tap each
    if (ui.build.sel === b.piece) placePiece(b.piece);
    else ui.build.sel = b.piece;
    return;
  }
  switch (b.id) {
    case 'zoomin':  setZoom(zoomIdx + 1); break;      // ZOOMS ascends: bigger scale = closer
    case 'zoomout': setZoom(zoomIdx - 1); break;
    case 'rotate':  rotate(1); break;
    case 'help':    ui.showHelp = !ui.showHelp; layoutUI(); break;
    case 'bld':     ui.build.open = !ui.build.open; ui.rideOpen = false; ui.selected = null; layoutUI(); break;
    case 'rid':     ui.rideOpen = !ui.rideOpen; ui.build.open = false; layoutUI(); break;
    case 'price_up': ride.price = Math.min(20, ride.price + 0.2); break;
    case 'price_dn': ride.price = Math.max(0, ride.price - 0.2); break;
    case 'ride_open':
      if (!ride.open && !ride.tested) { toast('TEST IT FIRST'); break; }
      if (ride.open) closeRide('RIDE CLOSED');
      else { ride.open = true; toast(ride.name + ' IS OPEN'); }
      layoutUI();
      break;
    case 'do_build': placePiece(ui.build.sel); break;
    case 'do_undo':  undoPiece(); layoutUI(); break;
    case 'do_test':  startTest(); break;
    case 'sim_stop': stopTest(); break;
    case 'sim_again': startTest(); break;
    case 'sim_cam':  sim.follow = !sim.follow; layoutUI(); break;
    case 'play':     ui.title = false; layoutUI(); break;
    case 'newpark':
    case 'newpark2':
      ui.confirm = { msg: 'WIPE THE PARK AND START AGAIN?', act: function () {
        newPark(); ui.title = false; ui.showHelp = false;
      } };
      layoutUI();
      break;
    case 'yes':
      var act = ui.confirm && ui.confirm.act;
      ui.confirm = null;
      if (act) act();
      layoutUI();
      break;
    case 'no':  ui.confirm = null; layoutUI(); break;
    case 'sound': muted = !muted; if (!muted) initAudio(); layoutUI(); break;
  }
}

/* ─────────────────────────── rendering ─────────────────────────── */

/* Which tile each piece gets painted on: the one nearest the camera, so the
   terrain behind it is already down and the terrain in front still covers it. */
var drawMap = {};
function buildDrawMap() {
  drawMap = {};
  for (var i = 0; i < track.pieces.length; i++) {
    var p = track.pieces[i], best = null, bestD = -1e9;
    for (var c = 0; c < p.cells.length; c++) {
      var cell = p.cells[c], dd = rotX(cell.x, cell.y) + rotY(cell.x, cell.y);
      if (dd > bestD) { bestD = dd; best = cell; }
    }
    var key = best.x + ',' + best.y;
    (drawMap[key] || (drawMap[key] = [])).push(p);
  }
  for (var k in drawMap) drawMap[k].sort(function (a, b) { return a.z - b.z; });
}

function drawPiece(g, p, tint, alpha) {
  var sdir = (p.d - cam.rot + 4) % 4;
  var spr = trackSprite(p.type, sdir, tint);
  var rx = rotX(p.x, p.y), ry = rotY(p.x, p.y);
  var sx = (rx - ry) * HW + cam.x + HW;
  var sy = (rx + ry) * HH - p.z * ZH + cam.y + HH;
  if (alpha !== undefined) g.globalAlpha = alpha;
  drawSupports(g, p, tint);
  g.drawImage(spr.c, Math.round(sx + spr.ox), Math.round(sy + spr.oy));
  if (alpha !== undefined) g.globalAlpha = 1;
}

/* Posts from the track down to whatever ground is underneath it. */
function drawSupports(g, p, tint) {
  var def = PIECES[p.type], f = pathFn(p.type);
  var right = (p.d + 1) % 4;
  var n = def.tiles;                          // roughly one post per tile
  for (var i = 0; i < n; i++) {
    var t = (i + 0.5) / n, q = f(t);
    var wx = p.x + q.u * DX[p.d] + q.v * DX[right];
    var wy = p.y + q.u * DY[p.d] + q.v * DY[right];
    var cx = clamp(Math.round(wx), 0, N - 1), cy = clamp(Math.round(wy), 0, N - 1);
    var gh = grid[cx][cy].h;
    var zz = p.z + q.w;
    if (zz - gh < 0.4) continue;
    var rx = rotX(wx, wy), ry = rotY(wx, wy);
    var sx = Math.round((rx - ry) * HW + cam.x + HW);
    var top = Math.round((rx + ry) * HH - zz * ZH + cam.y + HH);
    var foot = Math.round((rx + ry) * HH - gh * ZH + cam.y + HH + 4);
    if (foot <= top) continue;
    g.fillStyle = tint || PAL.postD;
    g.fillRect(sx - 1, top, 3, foot - top);
    g.fillStyle = tint || PAL.post;
    g.fillRect(sx - 1, top, 1, foot - top);
  }
}

function drawTerrain(g) {
  var maxD = 2 * N - 2;
  for (var d = 0; d <= maxD; d++) {
    var rxStart = Math.max(0, d - N + 1), rxEnd = Math.min(N - 1, d);
    for (var rx = rxStart; rx <= rxEnd; rx++) {
      var ry = d - rx;
      var w = unrot(rx, ry), t = grid[w.x][w.y];
      var sx = (rx - ry) * HW + cam.x;
      var sy = (rx + ry) * HH - t.h * ZH + cam.y;

      if (sx > bufW || sx + 32 < 0 || sy - 40 > bufH || sy + 100 < 0) continue;

      // --- cliff faces toward the two viewer-facing neighbours ---
      var nr = unrot(rx + 1, ry), nl = unrot(rx, ry + 1);
      var hr = (rx + 1 < N) ? grid[nr.x][nr.y].h : null;
      var hl = (ry + 1 < N) ? grid[nl.x][nl.y].h : null;
      var kind = t.h >= 2 ? 'rock' : 'dirt';
      var lip = t.t === 'grass';

      var dR = (hr === null) ? t.h * ZH + 10 : (t.h - hr) * ZH;
      if (dR > 0) g.drawImage(faceSprite('r', dR, kind, lip), sx + 16, sy + 8);
      var dL = (hl === null) ? t.h * ZH + 10 : (t.h - hl) * ZH;
      if (dL > 0) g.drawImage(faceSprite('l', dL, kind, lip), sx, sy + 8);

      // --- tile top ---
      if (t.t === 'water') {
        g.drawImage(SPR.water[ui.waterFrame], sx, sy);
      } else if (t.t === 'path') {
        var mask = 0;
        if (!isPathAt(rx, ry - 1)) mask |= 1;
        if (!isPathAt(rx - 1, ry)) mask |= 2;
        if (!isPathAt(rx, ry + 1)) mask |= 4;
        if (!isPathAt(rx + 1, ry)) mask |= 8;
        g.drawImage(pathSprite(mask), sx, sy);
      } else {
        var tone = t.h <= 1 ? 0 : t.h === 2 ? 1 : 2;
        g.drawImage(SPR.grass[tone][(w.x * 7 + w.y * 13) & 3], sx, sy);
      }

      // --- selection highlight ---
      if (ui.selected && ui.selected.x === w.x && ui.selected.y === w.y) {
        drawTileOutline(g, sx, sy, '#ffffff');
      }

      // --- objects standing on the tile ---
      if (t.obj) drawObject(g, t.obj, sx, sy);

      // --- track sitting on or above this tile ---
      var key = w.x + ',' + w.y;
      var here = drawMap[key];
      if (here) for (var q = 0; q < here.length; q++) drawPiece(g, here[q]);

      var folk = guestMap[key];
      if (folk) for (q = 0; q < folk.length; q++) drawGuest(folk[q], g);

      var cars = carMap[key];
      if (cars) for (q = 0; q < cars.length; q++) drawCar(g, cars[q].st, cars[q].i);
    }
  }

  // thought bubbles last, so they sit above everything and each other
  var shown = 0;
  for (var n = 0; n < guests.length && shown < 5; n++) {
    var gu = guests[n];
    if (gu.thoughtT > 0 && gu.state !== 'ride' && gu.sx !== undefined) {
      drawThought(gu, g); shown++;
    }
  }
}

/* ─────────────────────────── the train ─────────────────────────── */

function projectWorld(mx, my, mz) {            // metres → buffer pixels
  var tx = mx / TILE_M, ty = my / TILE_M, lz = mz / LEV_M;
  var rx = rotX(tx, ty), ry = rotY(tx, ty);
  return { sx: (rx - ry) * HW + cam.x + HW, sy: (rx + ry) * HH - lz * ZH + cam.y + HH };
}
function projectDir(tx, ty, lz) {              // a direction, not a point
  var drx, dry;
  switch (cam.rot) {
    case 1: drx = ty; dry = -tx; break;
    case 2: drx = -tx; dry = -ty; break;
    case 3: drx = -ty; dry = tx; break;
    default: drx = tx; dry = ty;
  }
  return { x: (drx - dry) * HW, y: (drx + dry) * HH - lz * ZH };
}

var CAR_COLS = ['#e0402c', '#d03a2a', '#c03626', '#b03222'];

function drawCar(g, st, idx) {
  var pos = projectWorld(st.x, st.y, st.z);
  var d = projectDir(st.t.x / TILE_M, st.t.y / TILE_M, st.t.z / LEV_M);
  var m = Math.hypot(d.x, d.y) || 1;
  var nx = d.x / m, ny = d.y / m;
  var col = CAR_COLS[idx % CAR_COLS.length];
  var inverted = st.u.z < -0.25;

  for (var i = -5; i <= 5; i++) {
    var x = Math.round(pos.sx + nx * i * 0.95), y = Math.round(pos.sy + ny * i * 0.95);
    g.fillStyle = '#2a1210'; g.fillRect(x, y - 1, 1, 3);
    g.fillStyle = col;       g.fillRect(x, y - 5, 1, 4);
    g.fillStyle = shadeHex(col, 1.3); g.fillRect(x, y - 5, 1, 1);
    if (!inverted && (i === -3 || i === 1)) {
      g.fillStyle = '#e8c49a'; g.fillRect(x, y - 7, 1, 2);
    }
  }
}

/* Guests are 8px tall, drawn straight to the buffer: a head, a shirt and two
   legs that swap over as they walk. */
function drawGuest(g, gg) {
  var rx = rotX(g.x, g.y), ry = rotY(g.x, g.y);
  var h = grid[clamp(Math.round(g.x), 0, N - 1)][clamp(Math.round(g.y), 0, N - 1)].h;
  var sx = Math.round((rx - ry) * HW + cam.x + HW);
  var sy = Math.round((rx + ry) * HH - h * ZH + cam.y + HH);

  gg.fillStyle = 'rgba(0,0,0,0.25)';
  gg.fillRect(sx - 2, sy - 1, 4, 1);
  gg.fillStyle = g.shirt;
  gg.fillRect(sx - 1, sy - 5, 3, 3);
  gg.fillStyle = shadeHex(g.shirt, 0.7);
  gg.fillRect(sx - 1, sy - 5, 1, 3);
  gg.fillStyle = '#2f3238';                       // legs
  if (g.frame) { gg.fillRect(sx - 1, sy - 2, 1, 2); gg.fillRect(sx + 1, sy - 2, 1, 2); }
  else { gg.fillRect(sx, sy - 2, 2, 2); }
  gg.fillStyle = g.skin;
  gg.fillRect(sx - 1, sy - 8, 3, 3);
  gg.fillStyle = '#3a2a1c';
  gg.fillRect(sx - 1, sy - 8, 3, 1);
  g.sx = sx; g.sy = sy;
}

function drawThought(g, gg) {
  var w = textW(g.thought) + 6, h = 12;
  var x = Math.round(g.sx - w / 2), y = Math.round(g.sy - 22);
  if (x < 1) x = 1;
  if (x + w > bufW - 1) x = bufW - 1 - w;
  gg.fillStyle = '#f4f2ea';
  gg.fillRect(x, y, w, h);
  gg.fillRect(g.sx - 1, y + h, 3, 3);
  gg.fillStyle = '#2b2b2b';
  gg.fillRect(x, y - 1, w, 1); gg.fillRect(x, y + h, w, 1);
  gg.fillRect(x - 1, y, 1, h); gg.fillRect(x + w, y, 1, h);
  text(gg, g.thought, x + 3, y + 3, '#2b2b2b');
}

var carMap = {}, guestMap = {};
function buildCarMap() {
  carMap = {};
  if (sim.active && sim.path) {
    for (var i = 0; i < CARS; i++) {
      var st = sampleAt(sim.s - i * CAR_GAP);
      var key = clamp(Math.round(st.x / TILE_M), 0, N - 1) + ',' +
                clamp(Math.round(st.y / TILE_M), 0, N - 1);
      (carMap[key] || (carMap[key] = [])).push({ st: st, i: i });
    }
  }
  guestMap = {};
  for (i = 0; i < guests.length; i++) {
    var g = guests[i];
    if (g.state === 'ride') continue;
    var k = clamp(Math.round(g.x), 0, N - 1) + ',' + clamp(Math.round(g.y), 0, N - 1);
    (guestMap[k] || (guestMap[k] = [])).push(g);
  }
}

/* The ghost always goes on top — it is a preview, not part of the scene. */
function drawGhost(g) {
  if (!ui.build.open || track.complete) return;
  var type = ui.build.sel, c = track.cursor;
  var why = checkPlace(type);
  var tint = why ? PAL.ghostNo : PAL.ghostOK;

  var cells = pieceCells(type, c.x, c.y, c.z, c.d);
  for (var i = 0; i < cells.length; i++) {
    var cell = cells[i];
    if (cell.x < 0 || cell.y < 0 || cell.x >= N || cell.y >= N) continue;
    var rx = rotX(cell.x, cell.y), ry = rotY(cell.x, cell.y);
    drawTileOutline(g, (rx - ry) * HW + cam.x,
                       (rx + ry) * HH - grid[cell.x][cell.y].h * ZH + cam.y, tint);
  }
  drawPiece(g, { type: type, x: c.x, y: c.y, z: c.z, d: c.d }, tint, 0.8);
}

function isPathAt(rx, ry) {
  if (rx < 0 || ry < 0 || rx >= N || ry >= N) return false;
  var w = unrot(rx, ry);
  return grid[w.x][w.y].t === 'path';
}

function drawTileOutline(g, sx, sy, colour) {
  g.fillStyle = colour;
  for (var y = 0; y < 16; y++) {
    var sp = diamondSpan(y);
    g.fillRect(sx + sp[0], sy + y, 1, 1);
    g.fillRect(sx + sp[0] + sp[1] - 1, sy + y, 1, 1);
  }
}

function drawObject(g, obj, sx, sy) {
  var img, ax = sx + 16, ay = sy + 8;
  switch (obj.type) {
    case 'tree':     img = SPR.tree[obj.v % SPR.tree.length]; break;
    case 'bench':    img = SPR.deco.bench; break;
    case 'bin':      img = SPR.deco.bin; break;
    case 'litter':   img = SPR.deco.litter; break;
    case 'entrance': img = SPR.deco.entrance; break;
    default: return;
  }
  g.drawImage(img, Math.round(ax - img.width / 2), Math.round(ay - img.height + 3));
}

function drawTopBar(g) {
  panel(g, 0, 0, uiW, 15);

  var items = [money(park.cash), 'GUESTS ' + guests.length,
               'HAPPY ' + Math.round(park.happy) + '%',
               MONTHS[park.month] + ' YEAR ' + park.year];
  var nameW = textW(park.name);
  function itemsW() {
    var w = 0;
    for (var i = 0; i < items.length; i++) w += textW(items[i]) + 10;
    return w;
  }
  while (items.length > 1 && nameW + 15 + itemsW() > uiW) items.pop();
  if (nameW + 15 + itemsW() <= uiW) text(g, park.name, 5, 4, PAL.uiText);

  var rx = uiW - 5;
  for (var i = items.length - 1; i >= 0; i--) {
    rx -= textW(items[i]);
    text(g, items[i], rx, 4, i === 0 ? '#12401c' : PAL.uiText);
    rx -= 10;
  }
}
var MONTHS = ['MARCH', 'APRIL', 'MAY', 'JUNE', 'JULY', 'AUGUST', 'SEPTEMBER', 'OCTOBER'];

/* Piece icons: schematic side views, drawn as pixel lines. They only have to
   be told apart at a glance — the window spells out the selected piece. */
function iconLine(g, x0, y0, x1, y1) {
  var dx = x1 - x0, dy = y1 - y0, n = Math.max(Math.abs(dx), Math.abs(dy));
  for (var i = 0; i <= n; i++) {
    g.fillRect(Math.round(x0 + dx * i / n), Math.round(y0 + dy * i / n), 1, 1);
  }
}
function drawPieceIcon(g, type, bx, by, col) {
  var x = bx + 3, y = by + 4;                 // 16×10 drawing box
  g.fillStyle = col;
  switch (type) {
    case 'straight': iconLine(g, x + 1, y + 6, x + 14, y + 6); break;
    case 'gentleUp': iconLine(g, x + 1, y + 8, x + 14, y + 3); break;
    case 'gentleDn': iconLine(g, x + 1, y + 3, x + 14, y + 8); break;
    case 'steepUp':  iconLine(g, x + 2, y + 9, x + 13, y + 0); break;
    case 'steepDn':  iconLine(g, x + 2, y + 0, x + 13, y + 9); break;
    case 'lift':
      iconLine(g, x + 1, y + 8, x + 14, y + 3);
      for (var i = 3; i < 14; i += 4) g.fillRect(x + i, y + 6 - ((i - 1) >> 1), 1, 1);
      break;
    case 'brake':
      iconLine(g, x + 1, y + 6, x + 14, y + 6);
      for (i = 4; i <= 12; i += 4) g.fillRect(x + i, y + 3, 1, 3);
      break;
    case 'curveR':
      iconLine(g, x + 1, y + 2, x + 8, y + 2);
      iconLine(g, x + 8, y + 2, x + 13, y + 8);
      g.fillRect(x + 11, y + 8, 4, 2);
      break;
    case 'curveL':
      iconLine(g, x + 1, y + 8, x + 8, y + 8);
      iconLine(g, x + 8, y + 8, x + 13, y + 2);
      g.fillRect(x + 11, y + 1, 4, 2);
      break;
    case 'loop':
      for (var a = 0; a < 24; a++) {
        var th = a / 24 * Math.PI * 2;
        g.fillRect(Math.round(x + 8 + Math.sin(th) * 4), Math.round(y + 5 - Math.cos(th) * 4.5), 1, 1);
      }
      iconLine(g, x + 1, y + 9, x + 5, y + 9);
      iconLine(g, x + 11, y + 9, x + 15, y + 9);
      break;
  }
}

/* Greedy word wrap, in characters — the face is monospace so that is exact. */
function wrapText(str, cols) {
  var words = str.split(' '), lines = [], line = '';
  for (var i = 0; i < words.length; i++) {
    var next = line ? line + ' ' + words[i] : words[i];
    if (next.length > cols && line) { lines.push(line); line = words[i]; }
    else line = next;
  }
  if (line) lines.push(line);
  return lines;
}

      b.on = ui.build.sel === b.piece;

function render() {

  drawUI(uctx);

  dctx.imageSmoothingEnabled = false;
  dctx.drawImage(buf.c, 0, 0, bufW, bufH, 0, 0, bufW * scale, bufH * scale);
  dctx.drawImage(uibuf.c, 0, 0, uiW, uiH, 0, 0, uiW * uiScale, uiH * uiScale);
}

/* ─────────────────────────── input ───────────────────────────
   Pointer Events only. One finger drags the map, two pinch to zoom, a short
   still press is a tap. Nothing depends on hover. */

var pointers = new Map();
var pinch = null;
var TAP_MOVE = 8, TAP_MS = 500;

function toBuf(e) {           // world-buffer pixels (terrain, picking)
  var r = disp.getBoundingClientRect();
  return {
    x: (e.clientX - r.left) * (disp.width / r.width) / scale,
    y: (e.clientY - r.top) * (disp.height / r.height) / scale
  };
}
function toUI(e) {            // UI-layer pixels (windows, buttons)
  var r = disp.getBoundingClientRect();
  return {
    x: (e.clientX - r.left) * (disp.width / r.width) / uiScale,
    y: (e.clientY - r.top) * (disp.height / r.height) / uiScale
  };
}

function onDown(e) {
  initAudio();
  try { disp.setPointerCapture(e.pointerId); } catch (err) { /* not a live pointer */ }
  var b = toBuf(e);
  pointers.set(e.pointerId, {
    id: e.pointerId, cx: e.clientX, cy: e.clientY,
    startX: e.clientX, startY: e.clientY,
    bx: b.x, by: b.y, t: performance.now(), moved: false, btn: null
  });

  if (pointers.size === 1) {
    var u = toUI(e);
    var hit = hitButton(u.x, u.y);
    if (hit) { hit.pressed = true; pointers.get(e.pointerId).btn = hit; }
  } else if (pointers.size === 2) {
    var ps = Array.from(pointers.values());
    ps.forEach(function (p) { p.moved = true; if (p.btn) { p.btn.pressed = false; p.btn = null; } });
    pinch = {
      dist: dist(ps[0], ps[1]),
      zoom: zoomIdx,
      mid: midBuf(ps[0], ps[1])
    };
  }
  e.preventDefault();
}

function dist(a, b) {
  var dx = a.cx - b.cx, dy = a.cy - b.cy;
  return Math.max(1, Math.hypot(dx, dy));
}
function midBuf(a, b) {
  var r = disp.getBoundingClientRect();
  return {
    x: ((a.cx + b.cx) / 2 - r.left) * (disp.width / r.width) / scale,
    y: ((a.cy + b.cy) / 2 - r.top) * (disp.height / r.height) / scale
  };
}

function onMove(e) {
  var p = pointers.get(e.pointerId);
  if (!p) return;
  var prevX = p.cx, prevY = p.cy;
  p.cx = e.clientX; p.cy = e.clientY;
  if (Math.abs(p.cx - p.startX) > TAP_MOVE || Math.abs(p.cy - p.startY) > TAP_MOVE) {
    if (!p.moved && p.btn) { p.btn.pressed = false; p.btn = null; }
    p.moved = true;
  }

  if (pointers.size >= 2 && pinch) {
    var ps = Array.from(pointers.values());
    var d = dist(ps[0], ps[1]);
    var ratio = d / pinch.dist;
    // ZOOMS is ordered coarse→fine in *device px per world px*, so a bigger
    // scale means zoomed in. Spread fingers → bigger scale → higher index.
    var target = ZOOMS[pinch.zoom] * ratio;
    var best = pinch.zoom, bestErr = Infinity;
    for (var i = 0; i < ZOOMS.length; i++) {
      var err = Math.abs(Math.log(ZOOMS[i] / target));
      if (err < bestErr) { bestErr = err; best = i; }
    }
    var mid = midBuf(ps[0], ps[1]);
    if (best !== zoomIdx) setZoom(best, mid.x, mid.y);
    else {
      cam.x += mid.x - pinch.mid.x;
      cam.y += mid.y - pinch.mid.y;
      clampCam();
    }
    pinch.mid = midBuf(ps[0], ps[1]);
    e.preventDefault();
    return;
  }

  if (pointers.size === 1 && p.moved) {
    var r = disp.getBoundingClientRect();
    var k = (disp.width / r.width) / scale;
    cam.x += (p.cx - prevX) * k;
    cam.y += (p.cy - prevY) * k;
    clampCam();
    if (sim.follow) { sim.follow = false; layoutUI(); }   // dragging takes over
  }
  e.preventDefault();
}

function onUp(e) {
  var p = pointers.get(e.pointerId);
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch = null;
  if (!p) return;

  if (p.btn) {
    p.btn.pressed = false;
    var still = !p.moved && performance.now() - p.t < TAP_MS * 3;
    if (still) pressButton(p.btn);
    e.preventDefault();
    return;
  }
  if (!p.moved && performance.now() - p.t < TAP_MS) tap(toBuf(e));
  e.preventDefault();
}

function onCancel(e) {
  var p = pointers.get(e.pointerId);
  if (p && p.btn) p.btn.pressed = false;
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch = null;
}

function tap(b) {
  var t = pickTile(b.x, b.y);
  if (t && ui.build.open && ui.mode === 'scenery') { placeScenery(t.x, t.y); return; }
  ui.selected = t;
  if (!t) toast('THAT IS THE VOID');
}

disp.addEventListener('pointerdown', onDown, { passive: false });
disp.addEventListener('pointermove', onMove, { passive: false });
disp.addEventListener('pointerup', onUp, { passive: false });
disp.addEventListener('pointercancel', onCancel);
disp.addEventListener('contextmenu', function (e) { e.preventDefault(); });
disp.addEventListener('wheel', function (e) {
  var b = toBuf(e);
  setZoom(zoomIdx + (e.deltaY > 0 ? -1 : 1), b.x, b.y);
  e.preventDefault();
}, { passive: false });

var keys = {};
window.addEventListener('keydown', function (e) {
  keys[e.key] = true;
  if (e.key === 'r' || e.key === 'R') rotate(1);
  if (e.key === '?' || e.key === '/') { ui.showHelp = !ui.showHelp; layoutUI(); }
  if (e.key === '+' || e.key === '=') setZoom(zoomIdx + 1);
  if (e.key === '-' || e.key === '_') setZoom(zoomIdx - 1);
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].indexOf(e.key) >= 0) e.preventDefault();
});
window.addEventListener('keyup', function (e) { keys[e.key] = false; });
window.addEventListener('blur', function () { keys = {}; });

/* ─────────────────────────── main loop ─────────────────────────── */

function update(dt) {
  if (ui.title || ui.confirm) return;     // the park waits while a dialog is up

  saveT += dt;
  if (saveT > 5) { saveT = 0; saveGame(); }

  var pan = 160 * dt;
  if (keys.ArrowLeft || keys.a) cam.x += pan;
  if (keys.ArrowRight || keys.d) cam.x -= pan;
  if (keys.ArrowUp || keys.w) cam.y += pan;
  if (keys.ArrowDown || keys.s) cam.y -= pan;
  if (keys.ArrowLeft || keys.ArrowRight || keys.ArrowUp || keys.ArrowDown) clampCam();

  ui.waterT += dt;
  if (ui.waterT > 0.35) { ui.waterT = 0; ui.waterFrame = (ui.waterFrame + 1) % SPR.water.length; }
  if (ui.toastT > 0) ui.toastT -= dt;

  // two substeps: the curvature through a loop is tight enough to want them
  if (sim.active) { stepSim(dt / 2); stepSim(dt / 2); }
  stepGuests(dt);

  // the calendar: a month every couple of minutes
  park.clock += dt;
  if (park.clock > 100) {
    park.clock = 0;
    park.month++;
    if (park.month >= MONTHS.length) { park.month = 0; park.year++; }
  }

  if (sim.active && sim.follow && sim.path) {
    var st = sampleAt(sim.s), pos = projectWorld(st.x, st.y, st.z);
    cam.x += (bufW / 2 - pos.sx) * 0.12;
    cam.y += (bufH * 0.46 - pos.sy) * 0.12;
    clampCam();
  }

  // Phase 5 hook: the guest sim steps here.
}

var lastT = 0, acc = 0;
function loop(ts) {
  requestAnimationFrame(loop);
  if (!lastT) lastT = ts;
  var dt = (ts - lastT) / 1000;
  lastT = ts;
  if (dt > MAX_DT) dt = MAX_DT;
  acc += dt;
  var steps = 0;
  while (acc >= STEP && steps < 8) { update(STEP); acc -= STEP; steps++; }
  if (steps === 8) acc = 0;
  render();
}

/* ─────────────────────────── boot ─────────────────────────── */

buildSprites();
generatePark();
initTrack();
loadBest();
if (!loadGame()) { generatePark(); initTrack(); }
buildPathList();
resize();
centreOn(11, 11);
layoutUI();

window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function () { setTimeout(resize, 120); });
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', resize);
  window.visualViewport.addEventListener('scroll', resize);
}
document.addEventListener('visibilitychange', function () {
  if (document.hidden) saveGame();
  else { lastT = 0; acc = 0; }
});
window.addEventListener('pagehide', saveGame);

requestAnimationFrame(loop);

})();
</script>
</body>
</html>
