function drawToast(g) {
  if (ui.toastT <= 0) return;
  var w = textW(ui.toast) + 12, h = 15;
  var x = (uiW - w) >> 1, y = 22;
  panel(g, x, y, w, h);
  text(g, ui.toast, x + 6, y + 4, PAL.uiText);
}

function drawStatusBar(g) {
  panel(g, 0, 0, uiW, 15);
  text(g, park.name, 5, 4, PAL.uiText);
  var items = [money(park.cash), 'GUESTS ' + park.guests, 'RATING ' + park.rating,
               MONTHS[park.month] + ' YEAR ' + park.year];
  var nameW = textW(park.name);
  function itemsW() {
    var t = 0;
    for (var i = 0; i < items.length; i++) t += textW(items[i]) + 10;
    return t;
  }
  while (items.length > 1 && nameW + 15 + itemsW() > uiW) items.pop();
  var rx = uiW - 5;
  for (var i = items.length - 1; i >= 0; i--) {
    rx -= textW(items[i]);
    text(g, items[i], rx, 4, i === 0 ? '#12401c' : PAL.uiText);
    rx -= 10;
  }
}

function drawNotice(g) {
  var n = ui.notice, win = n && n.win;
  if (!win) return;
  windowFrame(g, win.x, win.y, win.w, win.h, n.title);
  for (var i = 0; i < win.lines.length; i++) {
    text(g, win.lines[i], win.x + 6, win.y + 17 + i * 10, PAL.uiText);
  }
}

/* Being armed has to be obvious at arm's length on a tablet: a coloured
   border round the whole view, a banner saying what one finger will do, and
   the bill for the stroke in progress. */
function drawModeBanner(g) {
  if (!build.mode || build.mode === 'track') return;
  var msg = build.mode === 'station'
    ? (build.rideType.name + ' - TAP A SPOT, TURN, THEN PLACE')
    : (build.mode === 'entrance' ? 'TAP A TILE BY THE STATION FOR THE WAY IN'
                                 : 'NOW TAP ONE FOR THE WAY OUT');
  var w = Math.min(uiW - 180, textW(msg) + 12);
  panel(g, 2, 19, w, 15);
  text(g, msg, 8, 23, PAL.uiText);
}

function drawArmedChrome(g) {
  if (!armed()) return;
  var c = build.tool.tint;
  g.fillStyle = c;
  g.fillRect(0, 15, uiW, 2);
  g.fillRect(0, uiH - 2, uiW, 2);
  g.fillRect(0, 15, 2, uiH - 15);
  g.fillRect(uiW - 2, 15, 2, uiH - 15);

  var label = build.tool.hint;
  var st = build.stroke;
  var line = st && st.tiles
    ? label + '  ' + (st.nOk || 0) + ' OF ' + st.tiles.length + ' TILES  ' + money(build.cost)
    : label + '  1 FINGER DRAWS - 2 PANS';
  var w = Math.min(uiW - 62, textW(line) + 12);
  panel(g, 2, 17, w, 15);
  g.fillStyle = c;
  g.fillRect(2, 17, 3, 15);
  text(g, line, 8, 21, PAL.uiText);

  if (st && build.problem) {
    var p = build.problem;
    // money trouble is red, a bad spot is amber, skipped tiles are just a note
    var ink = p.kind === 'money' ? '#7a1f18' : p.kind === 'place' ? '#7a4a10' : PAL.uiDim;
    var head = p.kind === 'money' ? 'CANNOT AFFORD IT: '
             : p.kind === 'place' ? 'CANNOT BUILD THERE: ' : '';
    var msg = head + p.text;
    var ww = Math.min(uiW - 8, textW(msg) + 12);
    panel(g, 2, 34, ww, 14);
    text(g, msg, 8, 38, ink);
  }

  // the running bill sits by your finger, where you are actually looking
  if (st && st.px !== undefined && st.tiles) {
    var chip = (st.nOk || 0) + ' TILES  ' + money(build.cost);
    var cw = textW(chip) + 10, chx = clamp(Math.round(st.px - cw / 2), 2, uiW - cw - 2);
    var chy = clamp(Math.round(st.py - 26), 34, uiH - 20);
    panel(g, chx, chy, cw, 14);
    text(g, chip, chx + 5, chy + 4, build.ok ? PAL.uiText : '#7a1f18');
  }
}

function drawUI(g) {
  if (ui.notice) {
    drawStatusBar(g);
    drawNotice(g);
    for (var b = 0; b < buttons.length; b++) drawButton(g, buttons[b]);
    return;
  }
  for (var wi = 0; wi < wins.length; wi++) drawWin(g, wins[wi]);
  drawStatusBar(g);
  drawArmedChrome(g);
  drawModeBanner(g);

  if (ui.toolBar) panel(g, ui.toolBar.x, ui.toolBar.y, ui.toolBar.w, ui.toolBar.h);
  if (ui.catBar) panel(g, ui.catBar.x, ui.catBar.y, ui.catBar.w, ui.catBar.h);
  if (build.cat === 'LAND' && ui.toolBar) {
    var lp = 'LAND ' + money(landPrice()) + ' A TILE';
    var lw = textW(lp) + 12;
    panel(g, ui.toolBar.x, ui.toolBar.y - 17, lw, 15);
    text(g, lp, ui.toolBar.x + 6, ui.toolBar.y - 13, PAL.uiText);
  }

  var p = ui.camPanel;
  if (p) panel(g, p.x, p.y, p.w, p.h);
  for (var i = 0; i < buttons.length; i++) drawButton(g, buttons[i]);

  drawToast(g);
}

function render() {
  bctx.fillStyle = PAL.vd;
  bctx.fillRect(0, 0, bufW, bufH);
  buildTrackMap();
  drawWorld(bctx);
  drawStrokeGhost(bctx);
  drawTrackGhost(bctx);

  uctx.clearRect(0, 0, uiW, uiH);
  drawUI(uctx);

  dctx.imageSmoothingEnabled = false;
  dctx.drawImage(buf.c, 0, 0, bufW, bufH, 0, 0, bufW * scale, bufH * scale);
  dctx.drawImage(uibuf.c, 0, 0, uiW, uiH, 0, 0, uiW * uiScale, uiH * uiScale);
}

/* ─────────────────────────── input ───────────────────────────
   Pointer Events only. One finger drags the map, two pinch to zoom, a short
   still press is a tap. Nothing depends on hover. */

var pointers = new Map();
var pinch = null;
var TAP_MOVE = 8, TAP_MS = 500;

function toBuf(e) {           // world-buffer pixels
  var r = disp.getBoundingClientRect();
  return {
    x: (e.clientX - r.left) * (disp.width / r.width) / scale,
    y: (e.clientY - r.top) * (disp.height / r.height) / scale
  };
}
function toUI(e) {            // UI-layer pixels
  var r = disp.getBoundingClientRect();
  return {
    x: (e.clientX - r.left) * (disp.width / r.width) / uiScale,
    y: (e.clientY - r.top) * (disp.height / r.height) / uiScale
  };
}

function onDown(e) {
  try { disp.setPointerCapture(e.pointerId); } catch (err) { /* not a live pointer */ }
  var b = toBuf(e);
  pointers.set(e.pointerId, {
    id: e.pointerId, cx: e.clientX, cy: e.clientY,
    startX: e.clientX, startY: e.clientY,
    bx: b.x, by: b.y, t: performance.now(), moved: false, btn: null
  });

  if (pointers.size === 1) {
    var u = toUI(e);
    var hit = hitButton(u.x, u.y);
    var bar = hit ? null : winTitleAt(u.x, u.y);
    if (hit) { hit.pressed = true; pointers.get(e.pointerId).btn = hit; }
    else if (bar) {
      frontWin(bar.id);
      pointers.get(e.pointerId).winDrag = { id: bar.id, dx: u.x - bar.x, dy: u.y - bar.y };
      layoutUI();
    }
    else if (armed()) {
      // armed: one finger draws rather than pans
      var tl = pickTile(b.x, b.y);
      if (tl && !winAt(u.x, u.y)) {
        pointers.get(e.pointerId).drawing = true;
        var pu = toUI(e);
        build.stroke = { from: tl, to: tl, plans: null, px: pu.x, py: pu.y };
        planStroke();
      }
    }
  } else if (pointers.size === 2) {
    var ps = Array.from(pointers.values());
    // a second finger means pan and zoom, so any stroke in progress is dropped
    build.stroke = null;
    ps.forEach(function (p) {
      p.moved = true; p.drawing = false;
      if (p.btn) { p.btn.pressed = false; p.btn = null; }
    });
    pinch = { dist: dist(ps[0], ps[1]), zoom: zoomIdx, mid: midBuf(ps[0], ps[1]) };
  }
  e.preventDefault();
}

function dist(a, b) {
  var dx = a.cx - b.cx, dy = a.cy - b.cy;
  return Math.max(1, Math.hypot(dx, dy));
}
function midBuf(a, b) {
  var r = disp.getBoundingClientRect();
  return {
    x: ((a.cx + b.cx) / 2 - r.left) * (disp.width / r.width) / scale,
    y: ((a.cy + b.cy) / 2 - r.top) * (disp.height / r.height) / scale
  };
}

function onMove(e) {
  var p = pointers.get(e.pointerId);
  if (!p) return;
  var prevX = p.cx, prevY = p.cy;
  p.cx = e.clientX; p.cy = e.clientY;
  if (Math.abs(p.cx - p.startX) > TAP_MOVE || Math.abs(p.cy - p.startY) > TAP_MOVE) {
    if (!p.moved && p.btn) { p.btn.pressed = false; p.btn = null; }
    p.moved = true;
  }

  if (pointers.size >= 2 && pinch) {
    var ps = Array.from(pointers.values());
    var d = dist(ps[0], ps[1]);
    var ratio = d / pinch.dist;
    // ZOOMS ascends in device px per world px, so spreading fingers means a
    // bigger scale means a higher index
    var target = ZOOMS[pinch.zoom] * ratio;
    var best = pinch.zoom, bestErr = Infinity;
    for (var i = 0; i < ZOOMS.length; i++) {
      var err = Math.abs(Math.log(ZOOMS[i] / target));
      if (err < bestErr) { bestErr = err; best = i; }
    }
    var mid = midBuf(ps[0], ps[1]);
    if (best !== zoomIdx) setZoom(best, mid.x, mid.y);
    else {
      cam.x += mid.x - pinch.mid.x;
      cam.y += mid.y - pinch.mid.y;
      clampCam();
    }
    pinch.mid = midBuf(ps[0], ps[1]);
    e.preventDefault();
    return;
  }

  if (p.winDrag) {
    var w = findWin(p.winDrag.id);
    if (w && !narrowLayout()) {
      var u2 = toUI(e);
      w.x = Math.round(u2.x - p.winDrag.dx);
      w.y = Math.round(u2.y - p.winDrag.dy);
      layoutUI();
    }
    e.preventDefault();
    return;
  }

  if (p.drawing && build.stroke) {
    var pu2 = toUI(e);
    build.stroke.px = pu2.x; build.stroke.py = pu2.y;
    var tl = pickTile(toBuf(e).x, toBuf(e).y);
    if (tl && (tl.x !== build.stroke.to.x || tl.y !== build.stroke.to.y)) {
      build.stroke.to = tl;
      planStroke();
    }
    e.preventDefault();
    return;                                   // drawing never pans
  }

  if (pointers.size === 1 && p.moved) {
    var r = disp.getBoundingClientRect();
    var k = (disp.width / r.width) / scale;
    cam.x += (p.cx - prevX) * k;
    cam.y += (p.cy - prevY) * k;
    clampCam();
  }
  e.preventDefault();
}

function onUp(e) {
  var p = pointers.get(e.pointerId);
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch = null;
  if (!p) return;

  if (p.btn) {
    p.btn.pressed = false;
    if (!p.moved && performance.now() - p.t < TAP_MS * 3) pressButton(p.btn);
    e.preventDefault();
    return;
  }
  if (p.winDrag) { layoutUI(); e.preventDefault(); return; }
  if (p.drawing) {                            // a tap while armed is a one-tile stroke
    commitStroke();
    e.preventDefault();
    return;
  }
  if (!p.moved && performance.now() - p.t < TAP_MS) tap(toBuf(e), toUI(e));
  e.preventDefault();
}

function onCancel(e) {
  var p = pointers.get(e.pointerId);
  if (p && p.btn) p.btn.pressed = false;
  if (p && p.drawing) build.stroke = null;
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch = null;
}

function tap(b, uiPt) {
  if (ui.notice) return;
  if (uiPt && winAt(uiPt.x, uiPt.y)) return;
  var t = pickTile(b.x, b.y);

  if (build.mode === 'station') {
    if (!t) { toast('THAT IS OFF THE MAP'); return; }
    var d = build.station ? build.station.d : (0 - cam.rot + 4) % 4;
    build.station = { x: t.x, y: t.y, d: d };
    return;
  }
  if ((build.mode === 'entrance' || build.mode === 'exit') && build.ride) {
    if (!t) return;
    var plan = doorPlan(build.ride, t.x, t.y);
    if (!plan.ok) { toast(plan.why); return; }
    var tile = tileAt(t.x, t.y);
    tile.rideId = build.ride.id;
    tile.object = { type: build.mode === 'entrance' ? 'rideEntrance' : 'rideExit',
                    rideId: build.ride.id };
    if (build.mode === 'entrance') {
      build.ride.entranceTile = { x: t.x, y: t.y };
      build.mode = 'exit';
      toast('NOW THE WAY OUT');
    } else {
      build.ride.exitTile = { x: t.x, y: t.y };
      build.mode = 'track';
      build.ride.status = 'closed';
      toast(build.ride.name + ' IS BUILT');
    }
    layoutUI();
    saveGame();
    return;
  }

  if (armed()) return;
  ui.selected = t;
  if (!t) { toast('THAT IS OFF THE MAP'); return; }
  openTileWin(t);
}

disp.addEventListener('pointerdown', onDown, { passive: false });
disp.addEventListener('pointermove', onMove, { passive: false });
disp.addEventListener('pointerup', onUp, { passive: false });
disp.addEventListener('pointercancel', onCancel);
disp.addEventListener('contextmenu', function (e) { e.preventDefault(); });
disp.addEventListener('wheel', function (e) {
  var b = toBuf(e);
  setZoom(zoomIdx + (e.deltaY > 0 ? -1 : 1), b.x, b.y);
  e.preventDefault();
}, { passive: false });

var keys = {};
window.addEventListener('keydown', function (e) {
  keys[e.key] = true;
  if (e.key === 'r' || e.key === 'R') rotate(1);
  if (e.key === '?' || e.key === '/') toggleWin('help', openHelpWin);
  if (e.key === '+' || e.key === '=') setZoom(zoomIdx + 1);
  if (e.key === '-' || e.key === '_') setZoom(zoomIdx - 1);
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].indexOf(e.key) >= 0) e.preventDefault();
});
window.addEventListener('keyup', function (e) { keys[e.key] = false; });
window.addEventListener('blur', function () { keys = {}; });

/* ═══════════════════════════ save / load ═══════════════════════════
   Every load goes through migrate(). It steps a save forward one version at
   a time; anything it does not recognise is discarded rather than guessed
   at, so a save from an older schema can never half-load. */

function serialise() {
  var h = [], w = [], own = [], sale = [], surf = [], objs = [], paths = [];
  for (var i = 0; i < world.tiles.length; i++) {
    var t = world.tiles[i];
    h.push(t.h); w.push(t.water);
    own.push(t.owned ? 1 : 0); sale.push(t.forSale ? 1 : 0);
    surf.push(t.surface === 'sand' ? 1 : 0);
    if (t.object) objs.push([i, t.object.type, t.object.v || 0]);
    if (t.path) paths.push([i, t.path.type, t.path.level, t.path.bridge ? 1 : 0]);
  }
  return {
    v: SAVE_VERSION,
    world: WORLD,
    h: h, water: w, owned: own, sale: sale, surf: surf, objects: objs, paths: paths,
    entrance: world.entrance,
    park: { cash: park.cash, day: park.day, month: park.month, year: park.year,
            rating: park.rating, entryFee: park.entryFee },
    rides: serialiseRides(), nextRideId: nextRideId
  };
}

function serialiseRides() {
  var out = [];
  for (var i = 0; i < rides.length; i++) {
    var r = rides[i], pieces = [];
    for (var p = 0; p < r.pieces.length; p++) {
      var pc = r.pieces[p];
      pieces.push([pc.type, pc.x, pc.y, pc.z, pc.d]);
    }
    out.push({
      id: r.id, name: r.name, typeId: r.typeId, pieces: pieces,
      station: r.station, cursor: r.cursor, complete: r.complete,
      entranceTile: r.entranceTile, exitTile: r.exitTile,
      status: r.status, ratings: r.ratings, ticketPrice: r.ticketPrice
    });
  }
  return out;
}
function restoreRides(saved) {
  rides = [];
  for (var i = 0; i < (saved || []).length; i++) {
    var d = saved[i];
    var r = {
      id: d.id, name: d.name, typeId: d.typeId, pieces: [],
      station: d.station, cursor: d.cursor, complete: !!d.complete,
      entranceTile: d.entranceTile || null, exitTile: d.exitTile || null,
      status: d.status || 'closed',
      ratings: d.ratings || { excitement: 0, intensity: 0, nausea: 0 },
      ticketPrice: d.ticketPrice === undefined ? 2 : d.ticketPrice,
      queue: [], vehicles: [], stats: {}
    };
    rides.push(r);
    for (var p = 0; p < d.pieces.length; p++) {
      var pc = d.pieces[p];
      addPiece(r, pc[0], pc[1], pc[2], pc[3], pc[4]);
    }
    reclaimTiles(r);
  }
}

/* One version step per case, falling through to the newest. */
function migrate(save) {
  if (!save || typeof save !== 'object') return null;
  if (save.v === undefined) return null;          // pre-versioned: not ours
  if (save.v === 1) return null;                  // prototype schema: nothing to carry
  if (save.v === 2) {                             // 2 → 3: paths arrived
    save.paths = [];
    save.v = 3;
  }
  if (save.v === 3) {                             // 3 → 4: rides arrived
    save.rides = [];
    save.nextRideId = 1;
    save.v = 4;
  }
  // future: if (save.v === 4) { ...upgrade to 5...; save.v = 5; }
  if (save.v !== SAVE_VERSION) return null;
  if (save.world !== WORLD) return null;          // world resized under it
  if (!save.h || save.h.length !== WORLD * WORLD) return null;
  return save;
}

function applySave(save) {
  world.tiles = new Array(WORLD * WORLD);
  for (var i = 0; i < WORLD * WORLD; i++) {
    var t = newTile();
    t.h = save.h[i];
    t.water = save.water[i];
    t.owned = !!save.owned[i];
    t.forSale = !!save.sale[i];
    t.surface = save.surf[i] ? 'sand' : 'grass';
    world.tiles[i] = t;
  }
  for (i = 0; i < save.objects.length; i++) {
    var o = save.objects[i];
    world.tiles[o[0]].object = { type: o[1], v: o[2] };
  }
  var savedPaths = save.paths || [];
  for (i = 0; i < savedPaths.length; i++) {
    var pth = savedPaths[i];
    world.tiles[pth[0]].path = { type: pth[1], level: pth[2], bridge: !!pth[3] };
  }
  world.entrance = save.entrance || { x: WORLD >> 1, y: WORLD >> 1 };
  park.cash = save.park.cash;
  park.day = save.park.day; park.month = save.park.month; park.year = save.park.year;
  park.rating = save.park.rating; park.entryFee = save.park.entryFee;
  nextRideId = save.nextRideId || 1;
  restoreRides(save.rides);
  park.owned = ownedCount();
  pathGraph.dirty = true;
  rebuildPathGraph();
}

function saveGame() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(serialise())); } catch (e) {}
}
function loadGame() {
  var raw;
  try { raw = localStorage.getItem(SAVE_KEY); } catch (e) { return false; }
  if (!raw) return false;
  var parsed;
  try { parsed = JSON.parse(raw); } catch (e) { return false; }
  var save = migrate(parsed);
  if (!save) {
    if (parsed && parsed.v === 1) archiveV1(raw);
    return false;
  }
  applySave(save);
  return true;
}

/* A park built in the older game cannot be read by this one, and this one is
   about to save over the same key. Keep the old bytes exactly as they are,
   in a slot of their own, and say so once. Nothing here ever deletes. */
function archiveV1(raw) {
  try {
    var slot = ARCHIVE_KEY, existing = localStorage.getItem(slot);
    if (existing !== null && existing !== raw) {
      for (var n = 2; n <= 6; n++) {              // a later park, kept beside it
        slot = ARCHIVE_KEY + '-' + n;
        existing = localStorage.getItem(slot);
        if (existing === null || existing === raw) break;
      }
    }
    if (existing !== raw) localStorage.setItem(slot, raw);
    if (!localStorage.getItem(NOTICE_KEY)) {
      ui.notice = {
        title: 'YOUR OLD PARK IS SAFE',
        body: 'THIS PARK IS BUILT DIFFERENTLY AND CANNOT READ THE ' +
              'OLD ONE. NOTHING HAS BEEN THROWN AWAY - IT IS KEPT ' +
              'UNDER ' + slot.toUpperCase() + '.'
      };
    }
  } catch (e) { /* storage full or blocked: carry on with a fresh park */ }
}
function dismissNotice() {
  ui.notice = null;
  try { localStorage.setItem(NOTICE_KEY, '1'); } catch (e) {}
  layoutUI();
}

var best = 0;
function loadBest() {
  try { best = parseFloat(localStorage.getItem(BEST_KEY)) || 0; } catch (e) { best = 0; }
}

/* ─────────────────────────── main loop ─────────────────────────── */

var saveT = 0;

function update(dt) {
  var pan = 160 * dt;
  if (keys.ArrowLeft || keys.a) cam.x += pan;
  if (keys.ArrowRight || keys.d) cam.x -= pan;
  if (keys.ArrowUp || keys.w) cam.y += pan;
  if (keys.ArrowDown || keys.s) cam.y -= pan;
  if (keys.ArrowLeft || keys.ArrowRight || keys.ArrowUp || keys.ArrowDown) clampCam();

  ui.waterT += dt;
  if (ui.waterT > 0.32) { ui.waterT = 0; ui.waterFrame = (ui.waterFrame + 1) % 4; }
  if (ui.toastT > 0) ui.toastT -= dt;

  park.clock += dt;
  if (park.clock > 100) {
    park.clock = 0;
    park.month++;
    if (park.month >= MONTHS.length) { park.month = 0; park.year++; }
  }

  saveT += dt;
  if (saveT > 5) { saveT = 0; saveGame(); }
}

var lastT = 0, acc = 0;
function loop(ts) {
  requestAnimationFrame(loop);
  if (!lastT) lastT = ts;
  var dt = (ts - lastT) / 1000;
  lastT = ts;
  if (dt > MAX_DT) dt = MAX_DT;
  acc += dt;
  var steps = 0;
  while (acc >= STEP && steps < 8) { update(STEP); acc -= STEP; steps++; }
  if (steps === 8) acc = 0;
  render();
}

/* ─────────────────────────── boot ─────────────────────────── */

buildSprites();
loadBest();
generateWorld(20260806);
if (!loadGame()) { park.owned = ownedCount(); rebuildPathGraph(); }
resize();
centreOn(world.entrance.x, world.entrance.y - 6);
layoutUI();

window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function () { setTimeout(resize, 120); });
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', resize);
  window.visualViewport.addEventListener('scroll', resize);
}
document.addEventListener('visibilitychange', function () {
  if (document.hidden) saveGame();
  else { lastT = 0; acc = 0; }
});
window.addEventListener('pagehide', saveGame);

requestAnimationFrame(loop);

})();
</script>
</body>
</html>
