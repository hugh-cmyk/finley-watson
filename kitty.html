<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a0a0f'/%3E%3Cg fill='%2339ff14'%3E%3Crect x='4' y='8' width='24' height='9' rx='4'/%3E%3Crect x='3.5' y='11' width='8.5' height='14' rx='4.2'/%3E%3Crect x='20' y='11' width='8.5' height='14' rx='4.2'/%3E%3C/g%3E%3Cg fill='%230a0a0f'%3E%3Crect x='4.6' y='13.9' width='7.4' height='2.5' rx='0.5'/%3E%3Crect x='7.05' y='11.45' width='2.5' height='7.4' rx='0.5'/%3E%3Ccircle cx='22.3' cy='13.6' r='1.9'/%3E%3Ccircle cx='25.6' cy='16.4' r='1.9'/%3E%3C/g%3E%3C/svg%3E">
    <title>Kitty World — Finley Watson</title>
    <meta name="theme-color" content="#07000d">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --night: #07000d;
            --violet: #b45cff;
            --violet-soft: #e0c3ff;
            --safe-t: env(safe-area-inset-top, 0px);
            --safe-r: env(safe-area-inset-right, 0px);
            --safe-b: env(safe-area-inset-bottom, 0px);
            --safe-l: env(safe-area-inset-left, 0px);
        }

        html, body {
            height: 100%;
        }

        body {
            background: var(--night);
            color: var(--violet-soft);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
            overscroll-behavior: none;
        }

        .screen {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: calc(1.5rem + var(--safe-t)) calc(1rem + var(--safe-r))
                     calc(1.5rem + var(--safe-b)) calc(1rem + var(--safe-l));
            text-align: center;
        }
        .screen[hidden] { display: none; }

        /* ---------- Start screen ---------- */
        #start {
            background: radial-gradient(120% 90% at 50% 55%, #1a0029 0%, #0b0014 45%, #030006 100%);
            overflow: hidden;
        }

        #motes {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        /* Slow rolling fog banks */
        .fog {
            position: absolute;
            left: -30%;
            width: 160%;
            height: 45%;
            border-radius: 50%;
            filter: blur(50px);
            pointer-events: none;
            opacity: 0.45;
            will-change: transform;
        }
        .fog.f1 {
            bottom: -12%;
            background: radial-gradient(ellipse at center, rgba(107, 33, 168, 0.75) 0%, transparent 65%);
            animation: fogdrift1 38s ease-in-out infinite alternate;
        }
        .fog.f2 {
            bottom: 8%;
            background: radial-gradient(ellipse at center, rgba(180, 92, 255, 0.35) 0%, transparent 60%);
            animation: fogdrift2 52s ease-in-out infinite alternate;
        }
        .fog.f3 {
            top: -18%;
            background: radial-gradient(ellipse at center, rgba(60, 10, 90, 0.6) 0%, transparent 62%);
            animation: fogdrift1 64s ease-in-out infinite alternate-reverse;
        }
        @keyframes fogdrift1 { from { transform: translateX(-8%); } to { transform: translateX(8%); } }
        @keyframes fogdrift2 { from { transform: translateX(10%) scale(1.05); } to { transform: translateX(-10%) scale(1); } }

        .dare {
            position: relative;
            font-family: Georgia, "Times New Roman", serif;
            font-weight: 700;
            font-size: clamp(2.2rem, 10vw, 6rem);
            line-height: 1.05;
            letter-spacing: 0.06em;
            color: #f3e6ff;
            text-shadow:
                0 0 6px rgba(224, 195, 255, 0.9),
                0 0 18px rgba(180, 92, 255, 0.85),
                0 0 44px rgba(107, 33, 168, 0.9);
            animation: flicker 5.5s linear infinite;
        }
        .dare span { display: block; }

        /* Mostly steady glow with the odd dying-bulb stutter */
        @keyframes flicker {
            0%, 18%, 22%, 25%, 53%, 57%, 100% { opacity: 1; }
            20%, 24%, 55% { opacity: 0.35; }
            70% { opacity: 0.92; }
            72% { opacity: 1; }
        }

        .enter {
            position: relative;
            margin-top: clamp(1.8rem, 6vh, 3rem);
            padding: 0.55em 1.6em;
            font: inherit;
            font-weight: 800;
            font-size: clamp(1.6rem, 6vw, 2.6rem);
            letter-spacing: 0.18em;
            padding-left: calc(1.6em + 0.18em);
            color: #fff;
            background: linear-gradient(180deg, #7c2bc0 0%, #4a1478 100%);
            border: 2px solid var(--violet-soft);
            border-radius: 999px;
            cursor: pointer;
            box-shadow: 0 0 28px 4px rgba(180, 92, 255, 0.55);
            animation: throb 2.8s ease-in-out infinite;
            -webkit-tap-highlight-color: transparent;
        }
        .enter:hover,
        .enter:focus-visible {
            outline: none;
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.85), 0 0 46px 10px rgba(180, 92, 255, 0.8);
        }
        @keyframes throb {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .back {
            position: fixed;
            top: calc(0.9rem + var(--safe-t));
            left: calc(1rem + var(--safe-l));
            z-index: 5;
            font-size: 0.9rem;
            font-weight: 600;
            color: rgba(224, 195, 255, 0.7);
            text-decoration: none;
            padding: 0.4rem 0.2rem;
        }
        .back:hover,
        .back:focus-visible { color: #fff; }

        /* ---------- Video ---------- */
        #stage {
            position: fixed;
            inset: 0;
            background: #000;
        }
        #stage[hidden] { display: none; }

        #video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        .subtitle {
            position: absolute;
            left: calc(1rem + var(--safe-l));
            right: calc(1rem + var(--safe-r));
            bottom: calc(8vh + var(--safe-b));
            text-align: center;
            font-weight: 900;
            font-size: clamp(1.9rem, 7vw, 4rem);
            line-height: 1.15;
            color: #fff;
            -webkit-text-stroke: 0.14em #000;
            paint-order: stroke fill;
            text-shadow: 0 0.06em 0.12em rgba(0, 0, 0, 0.8);
            pointer-events: none;
            overflow-wrap: anywhere;
        }

        /* ---------- End + error screens ---------- */
        #end {
            background: #000;
            opacity: 0;
            transition: opacity 1.2s ease;
        }
        #end.shown { opacity: 1; }

        .caption {
            font-family: Georgia, "Times New Roman", serif;
            font-weight: 700;
            font-size: clamp(2rem, 9vw, 5rem);
            color: #fff;
            text-shadow: 0 0 18px rgba(180, 92, 255, 0.8), 0 0 40px rgba(107, 33, 168, 0.8);
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.9rem;
            margin-top: 2rem;
        }
        .btn {
            font: inherit;
            font-weight: 700;
            font-size: clamp(1rem, 4vw, 1.25rem);
            padding: 0.75em 1.5em;
            border-radius: 999px;
            border: 2px solid var(--violet-soft);
            background: #4a1478;
            color: #fff;
            text-decoration: none;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .btn.ghost { background: transparent; }
        .btn:hover,
        .btn:focus-visible {
            outline: none;
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.85), 0 0 26px rgba(180, 92, 255, 0.7);
        }

        #oops {
            background: radial-gradient(120% 90% at 50% 55%, #1a0029 0%, #030006 100%);
        }
        .oops-title {
            font-size: clamp(1.6rem, 7vw, 3rem);
            font-weight: 800;
            color: #fff;
        }
        .oops-text {
            margin-top: 0.8rem;
            max-width: 30rem;
            font-size: clamp(1rem, 4vw, 1.2rem);
            line-height: 1.5;
            color: rgba(224, 195, 255, 0.8);
        }

        @media (prefers-reduced-motion: reduce) {
            .fog, .dare, .enter { animation: none !important; }
            #end { transition: none; }
        }
    </style>
</head>
<body>
    <a class="back" id="back" href="index.html">← Back to games</a>

    <section class="screen" id="start" aria-label="Kitty World">
        <canvas id="motes"></canvas>
        <div class="fog f3"></div>
        <div class="fog f2"></div>
        <div class="fog f1"></div>
        <h1 class="dare"><span>ENTER IF</span><span>YOU DARE</span></h1>
        <button class="enter" id="enter" type="button">ENTER</button>
    </section>

    <div id="stage" hidden>
        <video id="video" src="kitty.mp4" playsinline webkit-playsinline preload="auto"></video>
        <div class="subtitle" id="subtitle" aria-live="polite"></div>
    </div>

    <section class="screen" id="end" hidden>
        <p class="caption">Kitty goes meow.</p>
        <div class="actions">
            <button class="btn" id="again" type="button">Watch again</button>
            <a class="btn ghost" href="index.html">Back to games</a>
        </div>
    </section>

    <section class="screen" id="oops" hidden>
        <p class="oops-title">The kitty is hiding! 🐱</p>
        <p class="oops-text">The video couldn't be loaded. Try again in a moment, or go and play something else.</p>
        <div class="actions">
            <button class="btn" id="retry" type="button">Try again</button>
            <a class="btn ghost" href="index.html">Back to games</a>
        </div>
    </section>

    <script>
    (function () {
        "use strict";

        // --- Subtitles: times are seconds into kitty.mp4. Edit freely. ---
        var SUBTITLES = [
            { start: 0.6, end: 1.7, text: "Meow!" },
            { start: 2.0, end: 3.6, text: "Meeeow!" },
            { start: 3.9, end: 5.6, text: "MEOW MEOW!" }
        ];

        var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

        var start = document.getElementById("start");
        var stage = document.getElementById("stage");
        var end = document.getElementById("end");
        var oops = document.getElementById("oops");
        var back = document.getElementById("back");
        var video = document.getElementById("video");
        var subtitle = document.getElementById("subtitle");

        var mode = "start";   // start | playing | end | oops
        var subRaf = 0;
        var fadeTimer = 0;

        function show(next) {
            mode = next;
            start.hidden = next !== "start";
            stage.hidden = next !== "playing" && next !== "end";
            oops.hidden = next !== "oops";
            back.hidden = next !== "start";
            if (next === "end") {
                end.hidden = false;
                // Next frame so the opacity transition actually runs
                requestAnimationFrame(function () { end.classList.add("shown"); });
            } else {
                end.hidden = true;
                end.classList.remove("shown");
            }
            if (next === "start") startMotes(); else stopMotes();
        }

        // ---------- Subtitles ----------
        var shownText = null;
        function setSubtitle(text) {
            if (text === shownText) return;
            shownText = text;
            subtitle.textContent = text;
        }
        function subtitleAt(t) {
            for (var i = 0; i < SUBTITLES.length; i++) {
                var s = SUBTITLES[i];
                if (t >= s.start && t < s.end) return s.text;
            }
            return "";
        }
        function tickSubtitles() {
            setSubtitle(subtitleAt(video.currentTime));
            subRaf = requestAnimationFrame(tickSubtitles);
        }
        function stopSubtitles() {
            cancelAnimationFrame(subRaf);
            subRaf = 0;
            setSubtitle("");
        }

        // ---------- Playback ----------
        // play() must be called synchronously inside the click so the
        // browser lets it start with sound.
        function playFromStart() {
            clearTimeout(fadeTimer);
            if (video.error) { show("oops"); return; }
            video.muted = false;
            try { video.currentTime = 0; } catch (e) {}
            var p = video.play();
            show("playing");
            stopSubtitles();
            tickSubtitles();
            if (p && p.catch) {
                p.catch(function (err) {
                    // An Escape before playback starts aborts play(); that's fine.
                    if (err && err.name === "AbortError") return;
                    failed();
                });
            }
        }

        function failed() {
            if (mode !== "playing" && mode !== "start") return;
            video.pause();
            stopSubtitles();
            show("oops");
        }

        function toStart() {
            clearTimeout(fadeTimer);
            video.pause();
            stopSubtitles();
            show("start");
            document.getElementById("enter").focus({ preventScroll: true });
        }

        video.addEventListener("ended", function () {
            stopSubtitles();
            show("end");
            fadeTimer = setTimeout(function () {
                document.getElementById("again").focus({ preventScroll: true });
            }, 400);
        });

        // A missing or broken kitty.mp4 only matters once someone presses Enter
        video.addEventListener("error", function () {
            if (mode === "playing") failed();
        });

        document.getElementById("enter").addEventListener("click", playFromStart);
        document.getElementById("again").addEventListener("click", playFromStart);
        document.getElementById("retry").addEventListener("click", function () {
            video.load();   // clears video.error and fetches again
            toStart();
        });

        document.addEventListener("keydown", function (e) {
            if (e.key === "Escape" && mode !== "start") {
                e.preventDefault();
                toStart();
            }
        });

        // ---------- Drifting motes ----------
        var canvas = document.getElementById("motes");
        var ctx = canvas.getContext("2d");
        var W = 0, H = 0, dpr = 1;
        var motes = [];
        var moteRaf = 0, last = 0;

        function resize() {
            W = window.innerWidth;
            H = window.innerHeight;
            dpr = Math.min(window.devicePixelRatio || 1, 2);
            canvas.width = Math.round(W * dpr);
            canvas.height = Math.round(H * dpr);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            var count = Math.min(60, Math.round(W * H / 18000));
            motes = [];
            for (var i = 0; i < count; i++) {
                motes.push({
                    x: Math.random() * W,
                    y: Math.random() * H,
                    r: 0.8 + Math.random() * 2.4,
                    vx: (Math.random() - 0.5) * 8,
                    vy: -4 - Math.random() * 10,
                    a: 0.2 + Math.random() * 0.5,
                    tw: Math.random() * Math.PI * 2
                });
            }
            if (reduce || !moteRaf) drawMotes(0, 0);
        }

        function drawMotes(t, dt) {
            ctx.clearRect(0, 0, W, H);
            for (var i = 0; i < motes.length; i++) {
                var m = motes[i];
                m.x += m.vx * dt;
                m.y += m.vy * dt;
                if (m.y < -10) { m.y = H + 10; m.x = Math.random() * W; }
                if (m.x < -10) m.x = W + 10;
                if (m.x > W + 10) m.x = -10;
                var alpha = m.a * (0.6 + 0.4 * Math.sin(m.tw + t * 0.9));
                ctx.beginPath();
                ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2);
                ctx.fillStyle = "rgba(214, 170, 255," + alpha.toFixed(3) + ")";
                ctx.shadowColor = "rgba(180, 92, 255, 0.9)";
                ctx.shadowBlur = 8;
                ctx.fill();
            }
        }

        function moteFrame(now) {
            var dt = last ? Math.min(0.05, (now - last) / 1000) : 0.016;
            last = now;
            drawMotes(now / 1000, dt);
            moteRaf = requestAnimationFrame(moteFrame);
        }
        function startMotes() {
            if (reduce || moteRaf) return;
            last = 0;
            moteRaf = requestAnimationFrame(moteFrame);
        }
        function stopMotes() {
            cancelAnimationFrame(moteRaf);
            moteRaf = 0;
        }

        window.addEventListener("resize", resize, { passive: true });
        resize();
        show("start");
    })();
    </script>
</body>
</html>
